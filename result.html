<style>
  .star-btn {
    font-size: 2rem;
    color: gray;          /* 初期色 */
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 5px;
    margin-top: -2px;
  }

  .star-btn.active {
    color: gold;          /* クリック後の色 */
  }
</style>


   <script>
  const btn = document.getElementById("favoriteBtn");
  

  btn.addEventListener("click", () => {
    const isActive = btn.classList.toggle("active");

    btn.setAttribute("aria-pressed", isActive); // アクセシビリティ対応
    btn.textContent = isActive ? "★" : "☆";    // 見た目を切り替え

  });
