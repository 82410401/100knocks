        <img src="logo/https_ja.m.wikipedia.org_wiki_E3_83_95_E3_82_A1_E3_82_A4_E3_83_AB_New_York_Yankees_logo.svg.jpg" alt="" data-tags="野球　青　やきゅう　あお　ｂ　やんきーす　a">

      <title>検索と画像ギャラリー</title>
    <style>
      h3 {
        background-color: #0A66BC;
        margin-bottom: auto;
        width: auto;
        font-size: 30px;
        text-align: center;
        color: #fff;
        padding: 40px;
      }
      body {
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        /*background: #fff;*/
        margin: 0 auto;
        background-image: url(../assets/onepoint/背景.jpeg);
        background-attachment: fixed;
        background-size: cover;
      }

      /* 🔍 検索バー */
      .search-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 40px;
        margin-top: 50px;
      }

      .search-wrap form {
        display: flex;
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }

      .search-wrap input[type="search"] {
        width: 320px;
        height: 40px;
        border: none;
        padding: 0 12px;
        font-size: 15px;
        outline: none;
      }

      .search-wrap button {
        background: #000;
        color: #fff;
        border: none;
        padding: 0 24px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .search-wrap button:hover {
        background: #222;
      }

      /* 🖼 ギャラリー */
      .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 横4列 */
        gap: 25px; /* 画像の間の余白 */
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px;
      }

     .gallery img {
        width: 100%;
        height: auto;
        border: 2px solid #000; /* 👈 黒い縁線を追加 */
        border-radius: 8px;     /* 角を少し丸める（必要なければ削除） */
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        display: block;
         transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .gallery img:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      }

      .gallery img {
        width: 100%;
        aspect-ratio: 1 / 1; /* 👈 正方形で統一 */
        object-fit: cover;   /* 👈 はみ出す部分はトリミング */
        border: 2px solid #000;
        border-radius: 8px;
        display: block;
      }
    </style>
    <script src="./assetsjs/search.js"></script>
</body>
