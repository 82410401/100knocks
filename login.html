<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>ログイン</title>
        <meta name="description" content="Web Entertainment Design">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="assetsimg/ロゴ4.png"><!--サイトロゴ-->
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
        <link rel="stylesheet" href="customcss/style.css">
    </head>
    <body>
        <!--ナビゲーション-->
        <header id="header">
            <div class="inner wrapper">
                <h1 class="logo">
                    <a href="./index.html"><img src="assetsimg/ロゴ4.png"></a>
                </h1>
                <nav>
                    <ul>
                        <li><a href="./login.html">ログイン</a></li>
                        <li><a href="./search.html">検索</a></li>
                        <li><a href="./about.html">デザイン</a></li>
                    </ul>
                </nav>
                <a href="./order.html"><img class="cart" src="onepoint/ic068.jpg"></a>
            </div>
        </header>

  
<h1 data-title="検索" class="page-title">ログイン</h1>
    <main class="login-container">
    <div class="login-box">
      <div class="user-icon">👤</div>
      <form id="loginForm">
        <input type="email" id="email" placeholder="メールアドレス" required>
        <input type="password" id="password" placeholder="パスワード" required>
        <button type="submit">ログイン</button>
        <p id="message"></p>
      </form>
      <a href="#" class="register-link">新規会員登録</a>
    </div>
  </main>


    <footer id="footer">
      <a href="./contact.html" class="content" >お問い合わせ</a>
    </footer>

    <script>
      const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("email").value;
      const pass = document.getElementById("password").value;

      // デモ用：固定のユーザー名とパスワード
      if (user === "kamiya@gmail.com" && pass === "1234") {
        message.textContent = "ログイン成功！";
        window.location.href = "./myPage.html";
        message.style.color = "green";
      } else {
        message.textContent = "ユーザー名またはパスワードが違います";
        message.style.color = "red";
      }
    });

    </script>
  </body>
</html>
