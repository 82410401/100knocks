<script>
/**
* このスクリプトは「いいね」ボタンの投票機能を実装するためのものです。
* 主な目的：
*  - ユーザーが複数の候補から1つに投票できるようにする
*  - 同じボタンを再クリックすると投票を取り消せる
*  - 別のボタンに投票し直すことができる
*  - 投票状態に応じてボタンの有効/無効を切り替える
*/

let votedButton = null; // 現在投票しているボタンを管理（nullなら未投票）

// 4つの「いいね」ボタンに対してイベントを設定
for (let i = 1; i <= 4; i++) {
const button = document.getElementById(`likeButton${i}`); // 対象ボタン
const countSpan = document.getElementById(`likeCount${i}`); // 投票数表示用
let count = 0; // このボタンの投票数（ローカル管理）

// ボタンがクリックされたときの処理
button.addEventListener('click', () => {
// ① 同じボタンを再クリック → 投票取り消し
if (votedButton === button) {
count--;
countSpan.textContent = count;
button.setAttribute('aria-pressed', 'false'); // アクセシビリティ対応
votedButton = null; // 投票解除
enableAllButtons(); // 全ボタンを再び有効化
return;
}

// ② 別のボタンに投票し直す場合 → 前のボタンを有効化＆状態リセット
if (votedButton) {
votedButton.disabled = false;
votedButton.setAttribute('aria-pressed', 'false');
}

// ③ 新しいボタンに投票
count++;
countSpan.textContent = count;
button.setAttribute('aria-pressed', 'true');
votedButton = button;

// 他のボタンを無効化（1つだけ選択状態にする）
disableOtherButtons(button);
});
}

// 他のボタンを無効化する関数
function disableOtherButtons(activeButton) {
for (let i = 1; i <= 4; i++) {
const btn = document.getElementById(`likeButton${i}`);
if (btn !== activeButton) {
btn.disabled = true;
}
}
}

// 全ボタンを有効化する関数（投票解除時に使用）
function enableAllButtons() {
for (let i = 1; i <= 4; i++) {
document.getElementById(`likeButton${i}`).disabled = false;
}
}
</script>
