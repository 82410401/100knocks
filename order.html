<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>注文</title>
<meta name="description" content="Web Entertainment Design">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assetsimg/ロゴ４.png"><!--サイトロゴ-->
<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
<link rel="stylesheet" href="customcss/style.css">
</head>
<body>
<!--ナビゲーション-->
<header id="header">
<div class="inner wrapper">
<h1 class="logo">
<a href="./index.html"><img src="assetsimg/ロゴ4.png"></a>
</h1>
<nav>
<ul>
<li><a href="./login.html">ログイン</a></li>
<li><a href="./search.html">検索</a></li>
<li><a href="./about.html">デザイン</a></li>
</ul>
</nav>
<a href="./order.html"><img class="cart" src="onepoint/ic068.jpg"></a>
</div>
</header>


<h1 data-title="検索" class="page-title">商品注文ページ</h1>

<main class="oder">
<div class="order-container">
<div class="item-row">
<div class="item-image-placeholder"><img src="./assetsimg/テキスト4.png"></div>
<div class="item-details">
<p><strong>シャツの種類：</strong></p>
<p><strong>　生　　地　：</strong></p>
</div>
<div class="item-details2">
<p><strong>半袖</strong></p>
<p><strong>ポリエステル</strong></p>
</div>

<div class="item-controls">
<div class="control-group">
<label for="size1">サイズ</label>
<select id="size1" name="size1">
<option value="M" selected>M</option>
<option value="L">XS</option>
<option value="M">S</option>
<option value="L">L</option>
<option value="M">XL</option>
<option value="L">XXL</option>
<option value="L">XXXL</option>
</select>
</div>
<div class="control-group">
<label for="quantity1">枚数</label>

<form action="#" method="post">
<input  type="number" id="quantity" name="quantity" min="0" max="100" value="0">
</form>
</select>
</div>
</div>
</div>
</div>
<div class="confirm-button-area">
<button class="confirm-button" id="additem">追加</button>
<button class="confirm-button" id="confirm-button" type="button">注文確定</button>
<div id="message" class="hidden">注文完了しました。</div>
</div>

</div>
</main>

<footer id="footer">
<a href="./contact.html" class="content" >お問い合わせ</a>
</footer>

</body>


<script>
document.addEventListener("DOMContentLoaded",() => {
const addBtn = document.getElementById("additem");

addBtn.addEventListener("click",(e) => {
e.preventDefault();

const rows = document.querySelectorAll(".item-row");
if(rows.length === 0) return;

const lastRow = rows[rows.length-1];

const clone = lastRow.cloneNode(true);

clone.querySelectorAll('input[type="number"]').forEach(input => {
input.value = 1;
});

clone.querySelectorAll('select').forEach(select => {
select.selectedindex = 0;
});

const container = document.querySelector(".order-container");
const confirmArea = container.querySelector(".confirm-button-area");
container.insertBefore(clone,confirmArea);
});
});

document.getElementById("confirm-button").addEventListener("click", (e) => {
const msg = document.getElementById("message");
msg.classList.remove("hidden");

// 数秒後に消したい場合（任意）
setTimeout(() => {
msg.classList.add("hidden");
}, 5000);
});

</script>

</html>
